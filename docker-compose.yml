services:
  postgres:
    image: postgres:16-alpine
    container_name: aee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aee_user
      POSTGRES_PASSWORD: aee_password
      POSTGRES_DB: aee_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
