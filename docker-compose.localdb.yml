# Local database overlay for EC2 deploy script when USE_RDS=false
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.localdb.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: aee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aee_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aee_user} -d ${POSTGRES_DB:-aee_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aee_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aee_db}?schema=public

volumes:
  pgdata:
